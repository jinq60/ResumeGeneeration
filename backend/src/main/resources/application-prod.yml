spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 邮箱验证码 SMTP：生产环境必须显式配置，禁止占位验证码裸奔上线
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    protocol: ${SMTP_PROTOCOL:smtp}
    properties:
      mail.smtp.auth: true
      # QQ 邮箱 465 端口须开启 SSL；587 端口须开启 STARTTLS
      mail.smtp.ssl.enable: ${SMTP_SSL_ENABLE:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_ENABLE:false}
      # 465 隐式 SSL 场景建议设置 socketFactory（QQ/163 等国内邮箱常见）
      mail.smtp.socketFactory.class: ${SMTP_SOCKET_FACTORY_CLASS:}
      mail.smtp.socketFactory.port: ${SMTP_SOCKET_FACTORY_PORT:}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  shutdown: graceful

# 生产环境关闭 API 文档，禁止接口结构对外暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: info
    com.resume: info
    org.springframework.security: info

app:
  minio:
    endpoint: ${APP_MINIO_ENDPOINT}
    access-key: ${APP_MINIO_ACCESS_KEY}
    secret-key: ${APP_MINIO_SECRET_KEY}
    buckets:
      avatars: ${APP_MINIO_BUCKET_AVATARS}
      pdfs: ${APP_MINIO_BUCKET_PDFS}
      templates: ${APP_MINIO_BUCKET_TEMPLATES}
    presigned-url-expiration: 3600
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  auth:
    verify-code:
      # 生产必须显式 strict：未接入真实验证码服务时注册将被拒绝（禁止占位验证码裸奔上线）
      mode: strict
    smtp:
      # 邮箱验证码 SMTP：须与 spring.mail.* 保持同步；host 为空时 EmailCodeService 降级为日志输出
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:}
