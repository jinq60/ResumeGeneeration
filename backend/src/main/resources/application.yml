spring:
  application:
    name: resume-generation
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.resume: debug

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: resume-generation

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
  playwright:
    chromium-args: --no-sandbox,--disable-setuid-sandbox
  render:
    # PDF/独立页面渲染时 /uploads/** 相对路径的外部前缀（如 http://your-domain），留空则保持相对路径
    public-base-url: ${APP_PUBLIC_BASE_URL:}
  admin:
    bootstrap:
      # 首个管理员初始化：仅当系统尚无任何 ADMIN 角色用户时生效（详见 AdminBootstrapRunner）
      phone: ${ADMIN_BOOTSTRAP_PHONE:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      nickname: ${ADMIN_BOOTSTRAP_NICKNAME:管理员}
  auth:
    verify-code:
      # 验证码模式：placeholder=任意 6 位数字（仅限开发测试）；strict=未配置真实验证码服务时拒绝注册
      mode: ${VERIFY_CODE_MODE:placeholder}
    email-code:
      # 邮箱验证码有效期与重发间隔
      ttl-minutes: 5
      resend-interval-seconds: 60
    oauth:
      # 后端对外基础地址（回调地址 = baseUrl + /auth/oauth/{provider}/callback）
      base-url: ${AUTH_OAUTH_BASE_URL:http://localhost:8080/api}
      # 登录成功后前端跳转地址（携带 token）
      frontend-redirect: ${AUTH_OAUTH_FRONTEND_REDIRECT:http://localhost:5173/login}
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      github:
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
      qq:
        app-id: ${QQ_APP_ID:}
        app-key: ${QQ_APP_KEY:}
    smtp:
      # 邮箱验证码发送；host 留空时降级为日志输出验证码（仅限本地开发）
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:}
    guest:
      # 每 IP 每天可创建的游客会话上限（防刷号）
      max-per-ip-per-day: ${GUEST_MAX_PER_IP_PER_DAY:50}
    login:
      # 连续登录失败锁定
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  rate-limit:
    max-requests: 60
    window-seconds: 60
  ai:
    providers:
      resume-review:
        provider: qwen
        model: qwen-turbo
        timeout: 60s
        retry: 2
      resume-optimize:
        provider: openai
        model: gpt-4o-mini
        timeout: 60s
        retry: 2
      avatar-optimize:
        provider: openai
        model: gpt-4o
        timeout: 120s
        retry: 1
      resume-writing:
        provider: qwen
        model: qwen-turbo
        timeout: 60s
        retry: 2
      resume-grammar:
        provider: qwen
        model: qwen-turbo
        timeout: 60s
        retry: 2
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
    qwen:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com
    ernie:
      api-key: ${ERNIE_API_KEY:}
      secret-key: ${ERNIE_SECRET_KEY:}
      base-url: https://aip.baidubce.com
    thread-pool:
      core-size: 4
      max-size: 8
      queue-capacity: 100
    rate-limit:
      max-concurrent-per-user: 3
    daily-quota:
      guest: 3
      user: 30
    prompts:
      resume-review: |
        你是一位资深HR和简历优化专家。请对以下简历进行全面点评：

        简历内容：
        {resumeContent}

        岗位描述：
        {jobDescription}

        请以JSON格式返回，严格遵循以下结构（不要输出其他内容）：
        {
          "overallScore": <0-100整数>,
          "dimensionScores": {
            "completeness": <0-100>,
            "structure": <0-100>,
            "content": <0-100>,
            "match": <0-100>,
            "expression": <0-100>
          },
          "suggestions": [
            {
              "sectionType": "<模块类型>",
              "title": "<建议标题>",
              "problem": "<存在问题>",
              "advice": "<修改建议>",
              "priority": "high|medium|low"
            }
          ],
          "highlights": ["<亮点1>", "<亮点2>"]
        }
      resume-optimize: |
        你是一位资深简历优化专家。用户希望针对以下岗位JD优化简历，你需要逐模块分析差距并给出修改建议：

        简历内容：
        {resumeContent}

        目标岗位JD：
        {jobDescription}

        请以JSON格式返回（不要输出其他内容）：
        {
          "matchScore": <0-100整数>,
          "dimensionScores": {
            "skills": <0-100>,
            "experience": <0-100>,
            "education": <0-100>,
            "projects": <0-100>
          },
          "optimizations": [
            {
              "sectionId": "<模块ID>",
              "sectionType": "<模块类型>",
              "originalSummary": "<原始内容摘要>",
              "optimizedContent": "<优化后的内容>",
              "reasoning": "<修改原因>"
            }
          ],
          "missingSkills": ["<缺失技能>"],
          "recommendations": ["<整体建议>"]
        }
      avatar-optimize: |
        你是一位专业证件照处理专家。请分析这张用户自拍照，描述如何将其优化为一寸证件照：
        要求：背景替换为指定颜色，保持面部特征一致，提升画质，自然美颜。

        目标背景色：{backgroundType}
        风格要求：{style}
      resume-writing: |
        你是一位资深简历写作专家。请根据要求对简历内容进行写作或改写：

        简历整体内容：
        {resumeContent}

        目标岗位：{jobDescription}

        当前模块：{sectionType} / 字段：{field}
        操作要求：
        - generate：根据简历上下文与目标岗位，为该字段生成合适的内容
        - polish：润色原文，保持事实与要点不变，表达更专业
        - shorten：精简原文，保留关键信息，去除冗余
        - expand：扩写原文，补充量化数据与细节，提升说服力
        - translate：将原文翻译为 {targetLang} 语言

        待处理原文：
        {originalText}

        要求：只输出最终文本本身，不要任何解释、标题、引号或前后缀。
      resume-grammar: |
        你是一位专业简历校对专家。请检查以下简历中的错别字、语法问题、表达不专业、主谓不一致和明显冗余。
        目标岗位：{targetPosition}

        简历结构化内容：{resumeContent}

        只返回合法 JSON，不包含 Markdown 或解释，结构必须是：
        {
          "issues": [
            {
              "sectionType": "introduction|work|project|education|profile|skill|custom",
              "field": "字段名",
              "itemIndex": 0,
              "severity": "high|medium|low",
              "originalText": "原文片段",
              "suggestion": "修改后的表达",
              "explanation": "问题说明"
            }
          ]
        }
        没有问题时返回 {"issues": []}。不要虚构事实，不要改变数字和技术名称。
