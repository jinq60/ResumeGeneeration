spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.resume: debug

app:
  jwt:
    secret: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUYwMTIzNDU2Nzg5QUJDREVGMDEyMzQ1Njc4OUFBQkNERUY=
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    buckets:
      avatars: resume-avatars
      pdfs: resume-pdfs
      templates: resume-templates
    presigned-url-expiration: 3600
  ai:
    providers:
      resume-review:
        provider: qwen
        model: qwen-turbo
      resume-optimize:
        provider: openai
        model: gpt-4o-mini
      avatar-optimize:
        provider: openai
        model: gpt-4o
      resume-writing:
        provider: qwen
        model: qwen-turbo
      resume-grammar:
        provider: qwen
        model: qwen-turbo
    openai:
      api-key: ${OPENAI_API_KEY:test-key}
      base-url: https://api.openai.com
    qwen:
      api-key: ${DASHSCOPE_API_KEY:test-key}
      base-url: https://dashscope.aliyuncs.com
    ernie:
      api-key: ${ERNIE_API_KEY:test-key}
      secret-key: ${ERNIE_SECRET_KEY:test-key}
      base-url: https://aip.baidubce.com
    thread-pool:
      core-size: 2
      max-size: 4
      queue-capacity: 50
    rate-limit:
      max-concurrent-per-user: 3
    daily-quota:
      guest: 3
      user: 30
    prompts:
      resume-review: "Test prompt {resumeContent} {jobDescription}"
      resume-optimize: "Test prompt {resumeContent} {jobDescription}"
      avatar-optimize: "Test prompt {backgroundType} {style}"
      resume-writing: "Test prompt {resumeContent} {jobDescription} {sectionType} {field} {action} {originalText} {targetLang}"
      resume-grammar: "Test prompt {resumeContent} {targetPosition}"
