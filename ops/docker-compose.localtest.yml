# 完全自包含的本地自测 compose
# 用法：docker compose -f docker-compose.localtest.yml --env-file .env.localtest up -d --build
# 修正了原 docker-compose.server.yml 中 redis healthcheck 的 environment 字段（不被支持）

services:
  mysql:
    image: mysql:8.0.36
    container_name: resume-test-mysql
    restart: unless-stopped
    env_file:
      - ./.env.localtest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - resume-test-mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - resume-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: resume-test-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./.env.localtest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - resume-test-minio-data:/data
    networks:
      - resume-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: resume-test-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - resume-net
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: resume-backend:${BACKEND_TAG:-localtest}
    container_name: resume-test-backend
    restart: unless-stopped
    env_file:
      - ./.env.localtest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      APP_MINIO_ENDPOINT: http://minio:9000
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_MINIO_ACCESS_KEY: ${APP_MINIO_ACCESS_KEY}
      APP_MINIO_SECRET_KEY: ${APP_MINIO_SECRET_KEY}
      APP_MINIO_BUCKET_AVATARS: ${APP_MINIO_BUCKET_AVATARS}
      APP_MINIO_BUCKET_PDFS: ${APP_MINIO_BUCKET_PDFS}
      APP_MINIO_BUCKET_TEMPLATES: ${APP_MINIO_BUCKET_TEMPLATES}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      ADMIN_BOOTSTRAP_PHONE: ${ADMIN_BOOTSTRAP_PHONE}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_NICKNAME: ${ADMIN_BOOTSTRAP_NICKNAME}
      VERIFY_CODE_MODE: ${VERIFY_CODE_MODE}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: resume-frontend:${FRONTEND_TAG:-localtest}
    container_name: resume-test-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    # 挂载本地 nginx 配置（纯 HTTP，无 HTTPS 证书）
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resume-net

volumes:
  resume-test-mysql-data:
  resume-test-minio-data:

networks:
  resume-net:
    driver: bridge
