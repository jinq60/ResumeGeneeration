services:
  mysql-test:
    image: mysql:8.0
    container_name: resume-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ResumeTest123
      MYSQL_DATABASE: resume_generation_test
      MYSQL_USER: resume_test
      MYSQL_PASSWORD: ResumeTest123
    ports:
      - "3307:3306"
    volumes:
      - resume-test-mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - resume-test-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pResumeTest123"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-test:
    image: minio/minio:latest
    container_name: resume-test-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - resume-test-minio-data:/data
    networks:
      - resume-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  resume-test-mysql-data:
  resume-test-minio-data:

networks:
  resume-test-net:
    name: resume-test-net
    driver: bridge
