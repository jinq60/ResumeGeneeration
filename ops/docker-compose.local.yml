# 本地（Windows/开发机）Docker 启动覆盖文件
# 用法：docker compose -f docker-compose.server.yml -f docker-compose.local.yml up -d --build
# 与 docker-compose.server.yml 的差异：
# 1. env_file 指向本地 ops/.env（服务器版指向 /opt/resume-generation/.env）
# 2. 前端 nginx 走纯 HTTP（无 HTTPS 证书），挂载本地 nginx.local.conf
services:
  mysql:
    env_file:
      - ./.env

  minio:
    env_file:
      - ./.env

  backend:
    env_file:
      - ./.env

  frontend:
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro