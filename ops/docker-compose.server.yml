# 服务器生产/测试环境编排
# 运行前请确保：
# 1. /opt/resume-generation/.env 已配置数据库、MinIO、JWT 等密钥；
# 2. 前端 dist/ 已生成（npm run build）；
# 3. 后端 Dockerfile 会在容器内自行执行 mvn package，无需在宿主机预先生成 jar。

services:
  mysql:
    image: mysql:8.0.36
    container_name: resume-mysql
    restart: unless-stopped
    env_file:
      - /opt/resume-generation/.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-resume_generation}
      MYSQL_USER: ${MYSQL_USER:-resume}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - resume-mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - resume-net
    healthcheck:
      # CMD 数组形式不做 shell 展开，必须用 CMD-SHELL 且 $$ 转义 compose 插值
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: resume-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - /opt/resume-generation/.env
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - resume-minio-data:/data
    networks:
      - resume-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: resume-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - resume-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: resume-backend:${BACKEND_TAG:-latest}
    container_name: resume-backend
    restart: unless-stopped
    env_file:
      - /opt/resume-generation/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/resume_generation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      APP_MINIO_ENDPOINT: http://minio:9000
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: resume-frontend:${FRONTEND_TAG:-latest}
    container_name: resume-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS 证书挂载（可选）：宿主机 /opt/resume-generation/certs/ 放置 fullchain.pem 与 privkey.pem
      - /opt/resume-generation/certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resume-net

  # 可选：Prometheus + Grafana 监控（G6）
  # 取消注释并按需调整配置后启用；数据采集目标为 backend 的 /actuator/prometheus
  # prometheus:
  #   image: prom/prometheus:v2.53.0
