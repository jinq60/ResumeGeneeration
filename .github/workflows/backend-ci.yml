name: Backend CI

on:
  push:
    branches:
      - production
      - develop
      - stable
  pull_request:
    branches:
      - production
      - develop

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn -B clean test

  integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start MySQL & MinIO
        run: docker compose -f ops/docker-compose.test.yml up -d --wait

      - name: Run integration tests
        working-directory: backend
        run: mvn -B test -Dtest=ResumeServiceIntegrationTest
        env:
          RUN_INTEGRATION_TESTS: "true"

      - name: Stop MySQL & MinIO
        if: always()
        run: docker compose -f ops/docker-compose.test.yml down -v
