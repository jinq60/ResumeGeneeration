name: Frontend CI

on:
  push:
    branches:
      - production
      - develop
      - stable
  pull_request:
    branches:
      - production
      - develop

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --ext .vue,.ts,.tsx

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build
