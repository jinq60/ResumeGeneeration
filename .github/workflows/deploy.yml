name: Deploy to Server

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy artifacts and Docker files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "backend/pom.xml,backend/src,backend/Dockerfile,frontend/dist,frontend/Dockerfile,frontend/nginx.conf,ops/docker-compose.server.yml"
          target: /opt/resume-generation/app
          strip_components: 0

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/resume-generation/app/ops
            docker compose -f docker-compose.server.yml pull mysql minio || true
            # 镜像打上提交短 SHA 标签，便于按版本回滚（docker compose up 指定旧 BACKEND_TAG/FRONTEND_TAG 即可）
            export BACKEND_TAG="${GITHUB_SHA::8}"
            export FRONTEND_TAG="${GITHUB_SHA::8}"
            docker compose -f docker-compose.server.yml up -d --build
            docker compose -f docker-compose.server.yml ps
            echo "Deployment finished, tags: backend=${BACKEND_TAG} frontend=${FRONTEND_TAG}"
